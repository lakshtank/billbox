<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BillBox</title>
    <meta name="description" content="Keep every receipt and know which warranties expire next." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#124E66" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#182026" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('billbox.theme') || 'light';
          // System theme permanently removed; support legacy prefers-color-scheme: dark migration
          if (t === 'system') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'gentle' : 'light';
          }
          var active = (t === 'dark' || t === 'gentle') ? t : 'light';
          document.documentElement.dataset.theme = active;
          if (active === 'dark' || active === 'gentle') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <style>
      :root {
        --bg-app-initial: #F6F8F8;
        --fg-app-initial: #212A31;
      }
      [data-theme="gentle"] {
        --bg-app-initial: #182026;
        --fg-app-initial: #F6F8F8;
      }
      [data-theme="dark"] {
        --bg-app-initial: #080B0D;
        --fg-app-initial: #FFFFFF;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-app-initial);
        color: var(--fg-app-initial);
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: var(--bg-app-initial);
      }
      @keyframes bootpulse {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/geist-latin-wght-normal.woff2" />
  </head>
  <body>
    <div id="root">
      <div id="billbox-boot" style="position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#124E66,transparent);animation:bootpulse 1.2s ease-in-out infinite;pointer-events:none;z-index:9999;"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
