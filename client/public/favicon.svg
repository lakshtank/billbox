<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <defs>
    <!-- Vibrant Tile Background -->
    <linearGradient id="fav-tile-bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E7A9C" />
      <stop offset="100%" stop-color="#0E3E52" />
    </linearGradient>

    <!-- Box Faces -->
    <linearGradient id="fav-box-left" x1="6" y1="18" x2="18" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14526A" />
      <stop offset="100%" stop-color="#0A2A38" />
    </linearGradient>
    <linearGradient id="fav-box-right" x1="18" y1="18" x2="30" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDE6" />
      <stop offset="100%" stop-color="#196C88" />
    </linearGradient>
  </defs>

  <!-- High-contrast Squircle Tile -->
  <rect width="36" height="36" rx="8.5" fill="url(#fav-tile-bg)" />
  <rect x="0.5" y="0.5" width="35" height="35" rx="8" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Box Deep Interior Vault -->
  <path d="M 6.5 18 L 18 13 L 29.5 18 L 18 23 Z" fill="#061A22" />

  <!-- Crisp White Bill Document -->
  <g>
    <path
      d="M 11 6 C 11 4.9 11.9 4 13 4 L 23 4 C 24.1 4 25 4.9 25 6 L 25 20.5 L 11 20.5 Z"
      fill="#FFFFFF"
      stroke="#0E3A4B"
      stroke-width="0.5"
    />
    <rect x="12.5" y="6" width="11" height="2.2" rx="1" fill="#124E66" />
    <rect x="12.5" y="10" width="7" height="1.5" rx="0.75" fill="#64748B" />
    <circle cx="22" cy="10.75" r="1.3" fill="#10B981" />
    <rect x="12.5" y="13" width="11" height="1.5" rx="0.75" fill="#94A3B8" />
    <line x1="12.5" y1="16.5" x2="23.5" y2="16.5" stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="1.5 1" />
  </g>

  <!-- Box Left Face -->
  <path
    d="M 6.5 18 L 18 23 L 18 31.5 C 18 31.8 17.6 32.1 17.3 31.9 L 7.1 27.2 C 6.7 27 6.5 26.6 6.5 26.2 Z"
    fill="url(#fav-box-left)"
  />

  <!-- Box Right Face -->
  <path
    d="M 18 23 L 29.5 18 L 29.5 26.2 C 29.5 26.6 29.3 27 28.9 27.2 L 18.7 31.9 C 18.4 32.1 18 31.8 18 31.5 Z"
    fill="url(#fav-box-right)"
  />

  <!-- Luminous Rim Bevel -->
  <path
    d="M 6.5 18 L 18 23 L 29.5 18"
    stroke="#7DD3FC"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path d="M 18 23 L 18 31.5" stroke="#0A2A38" stroke-width="0.75" />
</svg>