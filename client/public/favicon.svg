<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bb-left-face" x1="7" y1="17" x2="20" y2="36" gradientUnits="userSpaceOnUse">
      <stop stopColor="#124E66" />
      <stop offset="100%" stopColor="#0B303F" />
    </linearGradient>
    <linearGradient id="bb-right-face" x1="20" y1="17" x2="33" y2="36" gradientUnits="userSpaceOnUse">
      <stop stopColor="#1E7B9D" />
      <stop offset="100%" stopColor="#14566E" />
    </linearGradient>
    <linearGradient id="bb-box-interior" x1="7" y1="11" x2="33" y2="23" gradientUnits="userSpaceOnUse">
      <stop stopColor="#061B24" />
      <stop offset="100%" stopColor="#0D3545" />
    </linearGradient>
    <linearGradient id="bb-bill-grad" x1="12" y1="3" x2="28" y2="21" gradientUnits="userSpaceOnUse">
      <stop stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#EBF6F8" />
    </linearGradient>
    <filter id="bb-bill-shadow" x="10" y="2" width="20" height="22" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" floodColor="#000000" floodOpacity="0.25" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="20" cy="37" rx="12" ry="2.2" fill="#000000" fillOpacity="0.2" />

  <!-- Vault Interior -->
  <path d="M 7 17 L 20 11 L 33 17 L 20 23 Z" fill="url(#bb-box-interior)" />

  <!-- Digital Bill / Invoice -->
  <g filter="url(#bb-bill-shadow)">
    <path d="M 12.5 5.5 C 12.5 4.4 13.4 3.5 14.5 3.5 L 25.5 3.5 C 26.6 3.5 27.5 4.4 27.5 5.5 L 27.5 21 L 12.5 21 Z" fill="url(#bb-bill-grad)" />
    <rect x="15" y="6.5" width="10" height="2" rx="1" fill="#124E66" />
    <rect x="15" y="10.5" width="6.5" height="1.4" rx="0.7" fill="#75A6B8" />
    <circle cx="23.5" cy="11.2" r="1.3" fill="#10B981" />
    <rect x="15" y="13.5" width="10" height="1.4" rx="0.7" fill="#75A6B8" />
  </g>

  <!-- Front Left Face -->
  <path d="M 7 17 L 20 23 L 20 35.5 C 20 36.2 19.3 36.6 18.7 36.2 L 7.7 30 C 7.25 29.75 7 29.25 7 28.7 Z" fill="url(#bb-left-face)" stroke="#278DAF" stroke-width="0.5" stroke-opacity="0.4" />

  <!-- Front Right Face -->
  <path d="M 20 23 L 33 17 L 33 28.7 C 33 29.25 32.75 29.75 32.3 30 L 21.3 36.2 C 20.7 36.6 20 36.2 20 35.5 Z" fill="url(#bb-right-face)" stroke="#38A5C9" stroke-width="0.5" stroke-opacity="0.6" />

  <!-- Luminous Rim Bevel -->
  <path d="M 7 17 L 20 23 L 33 17" stroke="#54C2E6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Front Accent Highlight -->
  <path d="M 23 26 L 27.5 24" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4" />
</svg>